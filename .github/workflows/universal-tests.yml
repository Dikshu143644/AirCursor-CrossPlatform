name: Universal platform tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run platform-neutral core and universal tests
        run: python -m unittest tests.test_core tests.test_universal_ecosystem -v
      - name: Run Windows controller and integration tests
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -v
          python windows/test_windows_app.py
      - name: Run Linux input integration tests
        if: runner.os == 'Linux'
        run: PYTHONPATH=linux python -m unittest linux/test_linux.py -v
