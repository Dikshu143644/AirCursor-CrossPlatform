name: Universal platform tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vision]"
      - name: Run platform-neutral core, DevOps, and macOS adapter tests
        run: python -m unittest tests.test_core tests.test_devops tests.test_macos_driver -v
      - name: Run Linux input tests
        run: PYTHONPATH=linux python -m unittest linux/test_linux.py -v

  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vision]"
      - name: Run core and ecosystem tests
        run: python -m unittest discover -s tests -v
      - name: Run Windows controller tests
        run: python windows/test_windows_app.py

  macos:
    name: macOS / Python 3.12
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and native Quartz binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,macos]"
      - name: Run core and macOS adapter tests
        run: python -m unittest tests.test_core tests.test_macos_driver -v
