name: AirCursor Cross-Platform CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Core, remote, deployment and CAD tests
        run: |
          python -m unittest tests.test_core tests.test_web_remote tests.test_devops tests.test_cad_blender -v
      - name: Linux input engine tests
        env:
          PYTHONPATH: linux
        run: python -m unittest linux/test_linux.py -v

  windows:
    name: Windows integration / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run cross-platform, vision, remote, CAD and DevOps tests
        run: python -m unittest discover -s tests -v
      - name: Run native Windows integration tests
        run: python windows/test_windows_app.py
