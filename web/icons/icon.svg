<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad-bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Outer Head-Tracking Reticle Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#grad-cyan)" stroke-width="10" opacity="0.85" filter="url(#glow)" />
  
  <!-- Reticle Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="104" stroke="url(#grad-cyan)" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="408" x2="256" y2="456" stroke="url(#grad-cyan)" stroke-width="8" stroke-linecap="round" />
  <line x1="56" y1="256" x2="104" y2="256" stroke="url(#grad-cyan)" stroke-width="8" stroke-linecap="round" />
  <line x1="408" y1="256" x2="456" y2="256" stroke="url(#grad-cyan)" stroke-width="8" stroke-linecap="round" />

  <!-- AirPods / Motion Cursor Motif -->
  <!-- Left AirPod -->
  <g transform="translate(180, 160)">
    <circle cx="28" cy="28" r="32" fill="url(#grad-cyan)" />
    <rect x="20" y="44" width="16" height="72" rx="8" fill="url(#grad-cyan)" />
    <circle cx="28" cy="28" r="12" fill="#0f172a" />
  </g>
  <!-- Right AirPod -->
  <g transform="translate(276, 160)">
    <circle cx="28" cy="28" r="32" fill="url(#grad-cyan)" />
    <rect x="20" y="44" width="16" height="72" rx="8" fill="url(#grad-cyan)" />
    <circle cx="28" cy="28" r="12" fill="#0f172a" />
  </g>

  <!-- Glowing Center Target Dot -->
  <circle cx="256" cy="256" r="14" fill="#f8fafc" filter="url(#glow)" />
  <!-- Wave arc representing IMU / Audio stream -->
  <path d="M 196 380 Q 256 410 316 380" fill="none" stroke="url(#grad-purple)" stroke-width="8" stroke-linecap="round" />
</svg>
