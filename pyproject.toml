[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aircursor_core"
version = "1.0.5"
description = "Pure Python cross-platform Core Engine for AirCursor (Windows, Linux, Android)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AirCursor Cross-Platform Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "PyYAML>=6.0",
    "opencv-python-headless>=4.8",
]
vision = [
    "opencv-python-headless>=4.8",
]

[tool.setuptools.packages.find]
include = ["aircursor_core*"]


[tool.setuptools.package-data]
aircursor_core = ["static/*.html", "static/*.js", "static/*.json"]
