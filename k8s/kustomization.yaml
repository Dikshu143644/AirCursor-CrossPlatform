apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: aircursor
      app.kubernetes.io/part-of: aircursor-suite

images:
  - name: aircursor
    newName: aircursor
    newTag: latest
