apiVersion: v1
kind: Service
metadata:
  name: aircursor-service
  labels:
    app.kubernetes.io/name: aircursor
    app.kubernetes.io/part-of: aircursor-suite
    app.kubernetes.io/component: service-internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aircursor
  ports:
    - name: http-web
      port: 8765
      targetPort: 8765
      protocol: TCP
    - name: udp-sensor
      port: 4242
      targetPort: 4242
      protocol: UDP
