apiVersion: v1
kind: Service
metadata:
  name: aircursor-service
  labels:
    app.kubernetes.io/name: aircursor
    app.kubernetes.io/part-of: aircursor-suite
    app.kubernetes.io/component: service-internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aircursor
  ports:
    - name: http-web
      port: 8765
      targetPort: 8765
      protocol: TCP
    - name: udp-sensor
      port: 4242
      targetPort: 4242
      protocol: UDP
    - name: novnc-display
      port: 6080
      targetPort: 6080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: aircursor-external
  labels:
    app.kubernetes.io/name: aircursor
    app.kubernetes.io/part-of: aircursor-suite
    app.kubernetes.io/component: service-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aircursor
  ports:
    - name: http-web
      port: 8765
      targetPort: 8765
      nodePort: 30765
      protocol: TCP
    - name: udp-sensor
      port: 4242
      targetPort: 4242
      nodePort: 30424
      protocol: UDP
    - name: novnc-display
      port: 6080
      targetPort: 6080
      nodePort: 30608
      protocol: TCP
